spring.application.name=markly
# Cloud hosts such as Render provide the port in the PORT variable
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/markly}
spring.datasource.username=${DB_USER:markly}
spring.datasource.password=${DB_PASSWORD:markly_pw}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
