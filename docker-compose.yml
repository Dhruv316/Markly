services:
  db:
    image: postgres:16
    container_name: markly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: markly
      POSTGRES_USER: markly
      POSTGRES_PASSWORD: markly_pw
      TZ: Asia/Kolkata
    volumes:
      - markly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markly -d markly"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: markly-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/markly
      DB_USER: markly
      DB_PASSWORD: markly_pw
      TZ: Asia/Kolkata

  frontend:
    build: ./frontend
    container_name: markly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  markly-pgdata:
